<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your results</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=expand_more">
<link rel="stylesheet" href="/static/styles.css">
<!-- Material Web: the card is still in labs. If these fail to load, the cards
     fall back to plain CSS and still work. -->
<script type="module">
  import "https://cdn.jsdelivr.net/npm/@material/web@2.5.0/labs/card/elevated-card.js/+esm";
  import "https://cdn.jsdelivr.net/npm/@material/web@2.5.0/icon/icon.js/+esm";
  import "https://cdn.jsdelivr.net/npm/@material/web@2.5.0/ripple/ripple.js/+esm";
</script>
</head>
<body>

<main id="signin" class="signin" hidden>
  <h1>Your results</h1>
  <p class="lede">Sign in to see your latest bloodwork.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="james.chen@example.com">
  <button id="signin-button" type="button">Sign in</button>
  <p id="signin-error" class="error" role="alert" hidden></p>
  <p class="hint">
    Any of the seeded members will do, with no password:<br>
    james.chen@example.com &middot; priya.raman@example.com &middot;
    tom.okafor@example.com &middot; sofia.marek@example.com
  </p>
</main>

<div id="dashboard" hidden>
  <header class="bar">
    <div>
      <h1>Your results</h1>
      <p id="drawn" class="lede"></p>
    </div>
    <div class="bar-end">
      <span id="whoami"></span>
      <button id="signout-button" type="button" class="quiet">Sign out</button>
    </div>
  </header>
  <main>
    <div id="results"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="/static/perf.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
